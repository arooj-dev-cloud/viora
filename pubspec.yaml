name: viora
description: Viora, more than messages.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.8.4
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  uuid: ^4.5.1
  flutter_local_notifications: ^18.0.1
  flutter_webrtc: ^1.2.1
  video_player: ^2.11.1
  url_launcher: ^6.3.3
  record: ^6.0.0
  audioplayers: ^6.1.0
  gal: ^2.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/lumi_hero.png
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/viora.png
  adaptive_icon_background: '#210635'
  adaptive_icon_foreground: assets/icons/viora.png

# Forces the Linux recorder plugin that matches record 6.x
dependency_overrides:
  record_linux: ^1.2.1
